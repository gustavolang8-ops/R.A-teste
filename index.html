<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste R.A. - Computador</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bibliotecas base do A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- Cena de Realidade Aumentada puxando o arquivo de referência -->
  <a-scene mindar-image="imageTargetSrc: ./computador.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <!-- Elemento que aparecerá quando a foto for reconhecida (cubo verde) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box position="0 0 0" scale="0.5 0.5 0.5" color="#00FF00" opacity="0.8"></a-box>
    </a-entity>

  </a-scene>
  <script src="script.js"></script>
</body>
</html>
